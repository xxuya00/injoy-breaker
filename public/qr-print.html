<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DAY 2 · EGG CRACK QR 인쇄용</title>
<style>
  :root {
    --ink: #18140f;
    --ink-2: #221c16;
    --line: #3d3327;
    --accent: #ec93a3;
    --text: #f1e9db;
    --mute: #a89a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    background: var(--ink-2);
    border-bottom: 1px solid var(--line);
  }
  .toolbar h1 {
    font-size: 15px;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .toolbar p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--mute);
  }
  .toolbar button {
    flex: none;
    padding: 10px 18px;
    border-radius: 10px;
    border: 0;
    background: linear-gradient(180deg, #f6c3cd, var(--accent));
    color: var(--ink);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .baseRow {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .baseRow input {
    flex: 1;
    min-width: 220px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--ink);
    color: var(--text);
    font-size: 12.5px;
  }
  .baseRow button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--accent);
    font-size: 12.5px;
    cursor: pointer;
  }
  .warn {
    max-width: 1100px;
    margin: 24px auto 0;
    padding: 16px 20px;
    border: 1px solid #a8555f;
    background: #2a1a1c;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.7;
  }
  .warn strong {
    display: block;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    padding: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    break-inside: avoid;
  }
  .card .tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ink);
    background: var(--accent);
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .card h2 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  .card .loc {
    font-size: 12.5px;
    color: var(--mute);
    margin-bottom: 14px;
  }
  .card .qr {
    width: 200px;
    background: #fff;
    padding: 10px;
    border-radius: 12px;
    margin: 0 auto 12px;
  }
  .card .qr svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .card .url {
    font-size: 10px;
    color: var(--mute);
    word-break: break-all;
    margin-bottom: 6px;
  }
  .card .note {
    font-size: 11px;
    color: var(--mute);
    border-top: 1px dashed var(--line);
    padding-top: 8px;
    margin-top: 8px;
  }
  @media print {
    .toolbar { display: none; }
    body { background: #fff; color: #111; }
    .grid { display: block; padding: 0; }
    .card {
      background: #fff;
      border: 2px dashed #999;
      color: #111;
      margin-bottom: 24px;
      page-break-inside: avoid;
      page-break-after: always;
    }
    .card .tag { background: #eee; color: #111; }
    .card .loc, .card .url, .card .note { color: #444; }
    /* 종이에서는 크게. 숲에서 팔 뻗은 거리로도 잡히게 한다. */
    .card .qr { width: 260px; padding: 0; }
    .warn { display: none; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <div>
      <h1>DAY 2 · EGG CRACK — QR 인쇄용 페이지</h1>
      <p>6장을 인쇄해서 잘라, 숲/계곡 곳곳 해당 장소에 붙이거나 코팅해 걸어두세요.</p>
      <div class="baseRow">
        <input id="baseInput" type="text" placeholder="https://injoy-breaker.netlify.app" />
        <button id="applyBtn">이 주소로 QR 생성</button>
      </div>
    </div>
    <button id="printBtn">인쇄하기</button>
  </div>
  <div class="grid" id="grid"></div>

  <script type="module">
    import { qrSvg } from './qr-encode.js';

    // 배포된 사이트 주소. QR에는 이 주소가 통째로 구워지므로, 사이트를 옮기면 여기도 바꾸고
    // QR을 다시 뽑아야 한다.
    const DEFAULT_BASE = 'https://injoy-breaker.netlify.app';

    // locks.ts의 DAY 2 미션과 짝이 맞아야 한다. 여기는 public/ 아래라 앱 코드를 불러올 수 없어
    // 손으로 옮겨 적는다 — locks.ts에서 미션을 더하거나 이름을 고치면 이 목록도 같이 고칠 것.
    const MISSIONS = [
      { id: 'd2a', name: '계곡 근처' },
      { id: 'd2b', name: '숲길 벤치' },
      { id: 'd2c', name: '숙소 뒤편' },
      { id: 'd2e', name: '만남의 장소' },
      { id: 'd2f', name: '게시판 앞' },
      { id: 'd2g', name: '전망대' },
    ];

    /**
     * 폰이 실제로 열 수 있는 주소인지 본다.
     *
     * 예전에는 "인쇄 페이지를 연 주소"를 그대로 썼는데, 파일을 그냥 열면 그 값이 null이 되고
     * 개발 서버에서 열면 localhost가 된다. 둘 다 그럴듯한 QR이 인쇄되지만 폰으로 찍으면
     * 아무것도 열리지 않는다. 종이로 나간 뒤에는 되돌릴 수 없으니 여기서 막는다.
     */
    function checkBase(v) {
      if (!v) return { ok: false, why: '주소가 비어 있어요.' };
      let u;
      try {
        u = new URL(v);
      } catch {
        return { ok: false, why: '주소 형식이 아니에요. https:// 로 시작하는 사이트 주소를 넣어주세요.' };
      }
      if (u.protocol !== 'https:' && u.protocol !== 'http:') {
        return { ok: false, why: `${u.protocol} 주소는 폰 카메라가 열지 못해요. https:// 주소를 넣어주세요.` };
      }
      if (['localhost', '127.0.0.1', '0.0.0.0', '[::1]'].includes(u.hostname) || u.hostname.endsWith('.local')) {
        return { ok: false, why: 'localhost는 폰에서 폰 자신을 가리켜요. 배포된 사이트 주소(https://…)를 넣어주세요.' };
      }
      return { ok: true };
    }

    function getBase() {
      const saved = localStorage.getItem('qrPrintBase');
      if (saved && checkBase(saved).ok) return saved;
      // 배포된 사이트에서 이 페이지를 열었다면 그 주소가 가장 확실하다.
      if (checkBase(window.location.origin).ok) return window.location.origin;
      return DEFAULT_BASE;
    }

    function showWarning(why) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const box = document.createElement('div');
      box.className = 'warn';
      box.innerHTML = `
        <strong>이 주소로는 QR을 만들 수 없어요</strong>
        ${why}<br />
        찍어도 폰이 열 수 없는 QR이 인쇄되기 때문에, 주소를 고치기 전에는 그리지 않습니다.
      `;
      grid.appendChild(box);
    }

    function render() {
      const base = getBase();
      document.getElementById('baseInput').value = base;

      const check = checkBase(base);
      if (!check.ok) {
        showWarning(check.why);
        return;
      }

      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      MISSIONS.forEach((m) => {
        const url = `${base.replace(/\/$/, '')}/?qr=${m.id}`;
        const svg = qrSvg(url, 260);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <span class="tag">QR ${m.id}</span>
          <h2>${m.name}</h2>
          <div class="loc">DAY 2 · 알 깨기 미션</div>
          <div class="qr">${svg ?? ''}</div>
          <div class="url">${url}</div>
          <div class="note">스캔하면 앱이 바로 이 미션을 열어줍니다. 앱 안 카메라 버튼으로도, 폰 기본 카메라로도 똑같이 열려요.</div>
        `;
        if (!svg) {
          card.querySelector('.qr').textContent = '주소가 너무 길어 QR에 담기지 않아요';
        }
        grid.appendChild(card);
      });
    }

    function applyBase() {
      const v = document.getElementById('baseInput').value.trim().replace(/\/$/, '');
      const check = checkBase(v);
      if (!check.ok) {
        showWarning(check.why);
        return;
      }
      localStorage.setItem('qrPrintBase', v);
      render();
    }

    // 모듈 안의 함수는 onclick 속성에서 보이지 않는다.
    document.getElementById('applyBtn').addEventListener('click', applyBase);
    document.getElementById('printBtn').addEventListener('click', () => window.print());

    render();
  </script>
</body>
</html>
