<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DAY 2 · EGG CRACK QR 인쇄용</title>
<style>
  :root {
    --ink: #18140f;
    --ink-2: #221c16;
    --line: #3d3327;
    --accent: #ec93a3;
    --text: #f1e9db;
    --mute: #a89a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    background: var(--ink-2);
    border-bottom: 1px solid var(--line);
  }
  .toolbar h1 {
    font-size: 15px;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .toolbar p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--mute);
  }
  .toolbar button {
    flex: none;
    padding: 10px 18px;
    border-radius: 10px;
    border: 0;
    background: linear-gradient(180deg, #f6c3cd, var(--accent));
    color: var(--ink);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .baseRow {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .baseRow input {
    flex: 1;
    min-width: 220px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--ink);
    color: var(--text);
    font-size: 12.5px;
  }
  .baseRow button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--accent);
    font-size: 12.5px;
    cursor: pointer;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    padding: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    break-inside: avoid;
  }
  .card .tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ink);
    background: var(--accent);
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .card h2 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  .card .loc {
    font-size: 12.5px;
    color: var(--mute);
    margin-bottom: 14px;
  }
  .card img {
    width: 200px;
    height: 200px;
    background: #fff;
    padding: 10px;
    border-radius: 12px;
    display: block;
    margin: 0 auto 12px;
  }
  .card .url {
    font-size: 10px;
    color: var(--mute);
    word-break: break-all;
    margin-bottom: 6px;
  }
  .card .note {
    font-size: 11px;
    color: var(--mute);
    border-top: 1px dashed var(--line);
    padding-top: 8px;
    margin-top: 8px;
  }
  @media print {
    .toolbar { display: none; }
    body { background: #fff; color: #111; }
    .grid { display: block; padding: 0; }
    .card {
      background: #fff;
      border: 2px dashed #999;
      color: #111;
      margin-bottom: 24px;
      page-break-inside: avoid;
      page-break-after: always;
    }
    .card .tag { background: #eee; color: #111; }
    .card .loc, .card .url, .card .note { color: #444; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <div>
      <h1>DAY 2 · EGG CRACK — QR 인쇄용 페이지</h1>
      <p>6장을 인쇄해서 잘라, 숲/계곡 곳곳 해당 장소에 붙이거나 코팅해 걸어두세요.</p>
      <div class="baseRow">
        <input id="baseInput" type="text" placeholder="https://your-site.netlify.app" />
        <button onclick="applyBase()">이 주소로 QR 생성</button>
      </div>
    </div>
    <button onclick="window.print()">인쇄하기</button>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    const MISSIONS = [
      { id: 'd2a', name: '쾌락의 크랙', loc: '계곡 근처' },
      { id: 'd2b', name: '재물의 크랙', loc: '숲길 벤치' },
      { id: 'd2c', name: '지혜의 크랙', loc: '숙소 뒤편' },
      { id: 'd2e', name: '사람의 크랙', loc: '만남의 장소' },
      { id: 'd2f', name: '인정의 크랙', loc: '게시판 앞' },
      { id: 'd2g', name: '권력의 크랙', loc: '전망대' },
    ];

    function getBase() {
      const saved = localStorage.getItem('qrPrintBase');
      return saved || window.location.origin;
    }

    function render() {
      const base = getBase();
      document.getElementById('baseInput').value = base;
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      MISSIONS.forEach((m) => {
        const url = `${base}/?qr=${m.id}`;
        const qrImg = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=0&data=${encodeURIComponent(url)}`;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <span class="tag">QR ${m.id}</span>
          <h2>${m.name}</h2>
          <div class="loc">추천 위치 · ${m.loc}</div>
          <img src="${qrImg}" alt="${m.name} QR" />
          <div class="url">${url}</div>
          <div class="note">스캔하면 앱이 바로 이 미션을 열어줍니다. 이미지가 안 뜨면 인터넷 연결을 확인하세요(인쇄 후에는 재접속 불필요).</div>
        `;
        grid.appendChild(card);
      });
    }

    function applyBase() {
      const v = document.getElementById('baseInput').value.trim().replace(/\/$/, '');
      if (!v) return;
      localStorage.setItem('qrPrintBase', v);
      render();
    }

    render();
  </script>
</body>
</html>
